<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<title>COMM 5140 Study Guide</title>
<style>
:root{--navy:#304674;--blue:#98BAD5;--pale:#B2CBDE;--mist:#C6D3E3;--ice:#D8E1E8;--ink:#20304f;--muted:#65748b;--line:#d4dee7;--yellow:#fff0a8}
*{box-sizing:border-box}body{margin:0;background:#f4f8fb;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:920px;margin:auto;padding:0 14px 48px}
header{background:linear-gradient(135deg,var(--navy),#506b96,var(--blue));color:white;padding:28px 18px 24px;border-radius:0 0 28px 28px}header h1{margin:4px 0 5px;font-size:1.8rem}header p{margin:0;opacity:.92;line-height:1.4}.palette{display:grid;grid-template-columns:repeat(5,1fr);height:8px;border-radius:20px;overflow:hidden;margin-top:16px}.palette i:nth-child(1){background:#98BAD5}.palette i:nth-child(2){background:#C6D3E3}.palette i:nth-child(3){background:#304674}.palette i:nth-child(4){background:#B2CBDE}.palette i:nth-child(5){background:#D8E1E8}
.card{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(48,70,116,.08)}.dash{margin:16px 0;padding:15px;display:grid;gap:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f5f8fb;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:1.25rem;color:var(--navy)}.stat span{font-size:.75rem;color:var(--muted)}.bar{height:10px;background:var(--ice);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--navy);width:0}
.controls{position:sticky;top:8px;z-index:9;background:rgba(244,248,251,.94);backdrop-filter:blur(12px);padding:10px;border:1px solid var(--line);border-radius:16px;margin-bottom:12px}.controls input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px}.chips{display:flex;gap:6px;overflow:auto;padding-top:8px}.chip{border:1px solid var(--line);background:white;color:var(--muted);padding:8px 10px;border-radius:999px;white-space:nowrap;font-weight:800;font-size:.78rem}.chip.on{background:var(--navy);color:white;border-color:var(--navy)}
.book{margin-bottom:12px;overflow:hidden}.book button,.weekhead{width:100%;border:0;background:white;text-align:left;padding:14px;color:var(--navy);font-weight:900}.booklist{display:none;padding:0 14px 12px}.book.open .booklist{display:block}.chapter{padding:9px 0;border-top:1px solid #eef2f5;font-size:.85rem}.chapter b{display:inline-grid;place-items:center;width:28px;height:28px;background:var(--mist);border-radius:9px;margin-right:7px}
.weeks{display:grid;gap:11px}.week{overflow:hidden}.week.current{border:2px solid var(--blue)}.weekhead{display:flex;justify-content:space-between;gap:12px;align-items:center}.weektitle{font-weight:900}.topic{font-size:.82rem;color:var(--muted);margin-top:3px}.weekbody{display:none;padding:11px;background:#f8fafc;border-top:1px solid var(--line)}.week.open .weekbody{display:block}.count{font-size:.74rem;color:var(--muted)}
.task{background:white;border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:14px;padding:12px;margin-bottom:9px}.task.d{border-left-color:var(--navy)}.task.a{border-left-color:var(--pale)}.task.i{border-left-color:var(--mist)}.task.done{opacity:.7;background:#edf2f5}.task.done .title,.task.done .meta{text-decoration:line-through}.task.hi{background:var(--yellow)}.title{font-weight:850;line-height:1.35}.meta{font-size:.79rem;color:var(--muted);margin-top:4px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.actions button{min-height:43px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--navy);font-weight:800;font-size:.74rem}.actions button.sel{background:var(--navy);color:white}.note{display:none;margin-top:8px}.note.open{display:block}.note textarea{width:100%;min-height:85px;border:1px solid var(--line);border-radius:10px;padding:9px;font-size:16px}.install{background:var(--navy);color:white;padding:10px 14px;text-align:center;font-size:.82rem;display:none}
.empty{display:none;padding:24px;text-align:center;color:var(--muted)}
@media(min-width:700px){.dash{grid-template-columns:1fr 1fr;align-items:center}.actions{display:flex}.actions button{min-width:105px}}
</style>
</head>
<body>
<div class="install" id="install">On iPhone: tap Share → Add to Home Screen.</div>
<header><div class="wrap"><small>COMM 5140 • Fall 2026</small><h1>Qualitative Methods</h1><p>Interactive study guide • offline-ready • auto-saves your notes and progress</p><div class="palette"><i></i><i></i><i></i><i></i><i></i></div></div></header>
<main class="wrap">
<section class="card dash"><div><b id="now">Semester progress</b><p id="nowText" style="margin:5px 0;color:var(--muted);font-size:.88rem"></p><div class="bar"><i id="bar"></i></div></div><div class="stats"><div class="stat"><b id="done">0</b><span>Done</span></div><div class="stat"><b id="left">0</b><span>Left</span></div><div class="stat"><b id="notes">0</b><span>Notes</span></div></div></section>
<section class="controls"><input id="q" placeholder="Search chapters, authors, assignments…"><div class="chips" id="chips"><button class="chip on" data-f="all">All</button><button class="chip" data-f="todo">To Do</button><button class="chip" data-f="r">Readings</button><button class="chip" data-f="d">Assignments</button><button class="chip" data-f="hi">Highlighted</button><button class="chip" data-f="done">Done</button></div></section>
<section class="card book" id="book"><button id="bookbtn">📘 Tracy textbook — view all 14 chapter titles ▾</button><div class="booklist" id="booklist"></div></section>
<section class="weeks" id="weeks"></section><div class="card empty" id="empty">Nothing matches your search or filter.</div>
</main>
<script>
var DATA=[{"id":"w1","date":"2026-08-18","topic":"Introduction","tasks":[["r","Chapter 1 — Developing contextual research that matters","Sarah J. Tracy • Textbook"],["r","A practical guide to reflexivity in qualitative research","Olmos-Vega et al. (2023)"],["a","Self-reflexivity activity","In class"]]},{"id":"w2","date":"2026-08-25","topic":"Characteristics of Qual","tasks":[["r","Chapter 2 — Entering the conversation of qualitative research","Sarah J. Tracy • Textbook"],["r","Finding the Quality in Qualitative Research","Baym (2006)"],["r","Qualitative quality: Eight “big-tent” criteria for excellent qualitative research","Tracy (2010)"],["d","Reading Summary","Due 08/25"]]},{"id":"w3","date":"2026-09-01","topic":"Theoretical Foundations","tasks":[["r","Chapter 3 — Paradigmatic reflections and theoretical foundations","Sarah J. Tracy • Textbook"],["r","Competing paradigms in qualitative research","Guba & Lincoln (1994)"],["a","Paradigm Activity","In class"],["d","CITI Training","20 points • Due 09/01"],["d","Reading Summary","Due 09/01"]]},{"id":"w4","date":"2026-09-08","topic":"Interview Preparedness","tasks":[["r","Chapter 7 — Interview planning and design: Sampling, recruiting, and questioning","Sarah J. Tracy • Textbook"],["r","Chapter 4 — Fieldwork and fieldplay: Negotiating access and exploring the scene","Sarah J. Tracy • Textbook"],["d","Reading Summary","Due 09/08"],["a","Interview preparedness checklist + sample techniques","In class"]]},{"id":"w5","date":"2026-09-15","topic":"Interviewing as a Practice","tasks":[["r","Chapter 8 — Interview practice: Embodied, mediated, and focus-group approaches","Sarah J. Tracy • Textbook"],["r","Fieldwork horse-assery: Making the most of feeling humiliated, rebuffed, and offended during participant observation research","Tracy (2014)"],["a","Fishbowl activity","In class"],["d","Interview Project Part 1 — Interview Guide","25 points • Due 09/15"],["d","Reading Summary","Due 09/15"]]},{"id":"w6","date":"2026-09-22","topic":"Data Analysis","tasks":[["r","Chapter 9 — Data analysis basics: A pragmatic iterative approach","Sarah J. Tracy • Textbook"],["r","Chapter 10 — Advanced data analysis: The art and magic of interpretation","Sarah J. Tracy • Textbook"],["r","The pursuit of quality in grounded theory","Charmaz & Thornberg (2021)"],["r","The constant comparative method of qualitative analysis","Glaser (1965)"],["d","Interview Project Part 2 — Transcript and Summary","50 points • Due 09/22"],["d","Reading Summary","Due 09/22"]]},{"id":"w7","date":"2026-09-29","topic":"Thematic Analysis","tasks":[["r","Techniques to identify themes","Ryan & Bernard (2003)"],["r","Reflecting on reflexive thematic analysis","Braun & Clarke (2019)"],["r","Using thematic analysis in psychology","Braun & Clarke (2006)"],["d","Reading Summary","Due 09/29"]]},{"id":"w8","date":"2026-10-06","topic":"Taking Field Notes and Memos","tasks":[["r","Chapter 6 — Field roles, fieldnotes, and field focus","Sarah J. Tracy • Textbook"],["r","Shadowing in/as Work: Ten Recommendations for Shadowing Fieldwork Practice","Gill, Barbour & Dean (2014)"],["a","Group analysis practice","In class"],["d","Reading Summary","Due 10/06"]]},{"id":"w9","date":"2026-10-13","topic":"Qualitative Writing","tasks":[["r","Chapter 12 — Writing Part 1: The nuts and bolts of qualitative tales","Sarah J. Tracy • Textbook"],["r","Chapter 13 — Writing Part 2: Drafting, polishing, and publishing","Sarah J. Tracy • Textbook"],["r","Communicating qualitative research: Some practical guideposts for scholars","Goldberg & Allen (2015)"],["d","Reading Summary","Due 10/13"],["a","Article writing critique","In class"]]},{"id":"w10","date":"2026-10-20","topic":"Ethics","tasks":[["r","Chapter 11 — Qualitative quality: Creating a credible, ethical, significant study","Sarah J. Tracy • Textbook"],["r","Chapter 5 — Proposal writing: Explaining your research to institutional review boards, instructors, supervisory committees, and funding agencies","Sarah J. Tracy • Textbook"],["r","“Fighting mr. sleepy”: A metaphor for Black graduate student experiences","Austin (2021)"],["d","Reading Summary","Due 10/20"]]},{"id":"w11","date":"2026-10-27","topic":"Qual in the Age of AI","tasks":[["r","How to use artificial intelligence (AI) as a resource, methodological and analysis tool in qualitative research?","Christou (2023)"],["r","Qualitative research in the era of AI: A return to positivism or a new paradigm?","Chatzichristos (2025)"],["r","More or less than human? Evaluating the role of AI-as-participant in online qualitative research","Gibson & Beattie (2024)"],["d","Interview Project Part 3 — Interview Analysis","100 points • Due 10/27"],["d","Reading Summary","Due 10/27"],["a","Debate: AI usage in qualitative work","In class"]]},{"id":"w12","date":"2026-11-03","topic":"Exiting","tasks":[["r","Chapter 14 — Qualitative methodology matters: Exiting and communicating impact","Sarah J. Tracy • Textbook"],["r","Breaking the silence about exiting fieldwork","Michailova et al. (2014)"],["d","Reading Summary","Due 11/03"]]},{"id":"w13","date":"2026-11-10","topic":"IRB Proposal Writing Workshop","tasks":[["a","IRB Proposal Writing Workshop","In class"]]},{"id":"w14","date":"2026-11-17","topic":"Peer Critique","tasks":[["d","Peer Critique of Proposal","70 points • Due in class"]]},{"id":"w15","date":"2026-11-24","topic":"Fall Break","tasks":[["i","FALL BREAK — No class","No meeting"]]},{"id":"w16","date":"2026-12-01","topic":"IRB Proposal + Presentations","tasks":[["d","IRB Proposal","100 points • Due 12/01"],["i","Final — TBD","Date/time to be determined"],["d","IRB Proposal Presentation","50 points • Due 12/01"]]}];
var CH=[[1,"Developing contextual research that matters"],[2,"Entering the conversation of qualitative research"],[3,"Paradigmatic reflections and theoretical foundations"],[4,"Fieldwork and fieldplay: Negotiating access and exploring the scene"],[5,"Proposal writing: Explaining your research to institutional review boards, instructors, supervisory committees, and funding agencies"],[6,"Field roles, fieldnotes, and field focus"],[7,"Interview planning and design: Sampling, recruiting, and questioning"],[8,"Interview practice: Embodied, mediated, and focus-group approaches"],[9,"Data analysis basics: A pragmatic iterative approach"],[10,"Advanced data analysis: The art and magic of interpretation"],[11,"Qualitative quality: Creating a credible, ethical, significant study"],[12,"Writing Part 1: The nuts and bolts of qualitative tales"],[13,"Writing Part 2: Drafting, polishing, and publishing"],[14,"Qualitative methodology matters: Exiting and communicating impact"]];
var KEY="comm5140-github-pages-v1",S={tasks:{},weeks:{}},F="all";
try{S=JSON.parse(localStorage.getItem(KEY))||S}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function st(id){if(!S.tasks[id])S.tasks[id]={done:false,hi:false,note:"",open:false};return S.tasks[id]}
function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function d(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function current(){var t=today(),x=0;for(var i=0;i<DATA.length;i++){if(t>=d(DATA[i].date))x=i}return x}
function renderBook(){booklist.innerHTML=CH.map(function(c){return '<div class="chapter"><b>'+c[0]+'</b>'+esc(c[1])+'</div>'}).join("")}
function render(){
var ci=current();weeks.innerHTML=DATA.map(function(w,wi){var open=typeof S.weeks[w.id]=="boolean"?S.weeks[w.id]:wi==ci;var tasks=w.tasks.map(function(t,ti){var id=w.id+"-"+ti,s=st(id);return '<article class="task '+t[0]+' '+(s.done?'done ':'')+(s.hi?'hi':'')+'" data-id="'+id+'" data-type="'+t[0]+'" data-search="'+esc((t[1]+" "+t[2]).toLowerCase())+'"><div class="title">'+esc(t[1])+'</div><div class="meta">'+esc(t[2])+'</div><div class="actions"><button data-a="hi" data-id="'+id+'">🟨 Highlight</button><button class="'+(s.done?'sel':'')+'" data-a="done" data-id="'+id+'">'+(s.done?'↩ Undo':'✅ Complete')+'</button><button data-a="note" data-id="'+id+'">📝 Notes</button></div><div class="note '+((s.open||s.note)?'open':'')+'"><textarea data-note="'+id+'" placeholder="Add personal notes…">'+esc(s.note)+'</textarea></div></article>'}).join("");var done=w.tasks.filter(function(t,ti){return st(w.id+"-"+ti).done}).length;return '<section class="card week '+(open?'open ':'')+(wi==ci?'current':'')+'" id="'+w.id+'"><button class="weekhead" data-week="'+w.id+'"><div><div class="weektitle">Week '+(wi+1)+' • '+esc(w.topic)+'</div><div class="topic">'+new Date(w.date+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"})+(wi==ci?' • THIS WEEK':'')+'</div></div><span class="count">'+done+'/'+w.tasks.length+' done ▾</span></button><div class="weekbody">'+tasks+'</div></section>'}).join("");
bind();filter();dash()
}
function bind(){
document.querySelectorAll("[data-week]").forEach(function(b){b.onclick=function(){var id=b.dataset.week,e=document.getElementById(id);e.classList.toggle("open");S.weeks[id]=e.classList.contains("open");save()}});
document.querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){var s=st(b.dataset.id),a=b.dataset.a;if(a=="done")s.done=!s.done;if(a=="hi")s.hi=!s.hi;if(a=="note")s.open=!s.open;save();render()}});
document.querySelectorAll("[data-note]").forEach(function(a){a.oninput=function(){var s=st(a.dataset.note);s.note=a.value;s.open=true;save();dash()}})
}
function filter(){var text=q.value.toLowerCase(),any=false;document.querySelectorAll(".week").forEach(function(w){var n=0;w.querySelectorAll(".task").forEach(function(e){var s=st(e.dataset.id),ok=!text||e.dataset.search.indexOf(text)>-1;if(F=="todo")ok=ok&&!s.done;if(F=="r"||F=="d")ok=ok&&e.dataset.type==F;if(F=="hi")ok=ok&&s.hi;if(F=="done")ok=ok&&s.done;e.style.display=ok?"block":"none";if(ok)n++});w.style.display=n?"block":"none";if(n)any=true});empty.style.display=any?"none":"block"}
function dash(){var ids=[];DATA.forEach(function(w){w.tasks.forEach(function(t,i){ids.push(w.id+"-"+i)})});var dn=ids.filter(function(i){return st(i).done}).length,nt=ids.filter(function(i){return st(i).note.trim()}).length,p=Math.round(dn/ids.length*100),cw=DATA[current()];done.textContent=dn;left.textContent=ids.length-dn;notes.textContent=nt;bar.style.width=p+"%";now.textContent="Week "+(current()+1)+" • "+cw.topic;nowText.textContent=p+"% of tracked items complete"}
q.oninput=filter;chips.onclick=function(e){var b=e.target.closest("[data-f]");if(!b)return;F=b.dataset.f;document.querySelectorAll(".chip").forEach(function(x){x.classList.toggle("on",x==b)});filter()};
bookbtn.onclick=function(){book.classList.toggle("open")};
renderBook();render();
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js")});
var ua=navigator.userAgent,isIOS=/iPhone|iPad|iPod/.test(ua),standalone=navigator.standalone||(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches);if(isIOS&&!standalone)install.style.display="block";
</script>
